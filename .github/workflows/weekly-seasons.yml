name: Weekly seasons
on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"      # Mondays 03:00 UTC; the Claude routine reads the result later that day
permissions:
  contents: write
jobs:
  seasons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 weekly_seasons.py 2>&1 | tail -20
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add seasons.json research/recent_finished.json
          git diff --cached --quiet || (git commit -m "Weekly seasons refresh" && git push)
