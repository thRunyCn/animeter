name: Add extra series
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [extra.json, fetch_extra.py, .github/workflows/fetch-extra.yml]
permissions:
  contents: write
jobs:
  extra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 fetch_extra.py 2>&1 | tee fetch_extra.log || true
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add -f fetch_extra.log top.json seasons.json tags.json web/covers
          git diff --cached --quiet || (git commit -m "Add extra series from AniList" && git push)
