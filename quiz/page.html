<title>Anime Kentei</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;800&display=swap">
<style>
/* One motif: the pencil oval of a Japanese mark-sheet exam. It masks every picture, shapes every button and answer,
   counts down the timer and stamps the grade. Bottle-green ink on paper, one yellow. */
:root {
  --bg: #f7f7f7;
  --surface: #ebebeb;
  --ink: #0d2a1c;
  --muted: #56625b;
  --accent: #f6e016;
  --face: 'M PLUS Rounded 1c', 'Hiragino Maru Gothic ProN', 'Arial Rounded MT Bold', system-ui, sans-serif;
  --step-small: clamp(0.8125rem, 0.79rem + 0.1vw, 0.875rem);
  --step-body: clamp(1.0625rem, 1rem + 0.25vw, 1.1875rem);
  --step-lead: clamp(1.25rem, 1.1rem + 0.7vw, 1.625rem);
  --step-head: clamp(2rem, 1.3rem + 3.2vw, 4rem);
  --step-display: clamp(3.25rem, 1.6rem + 6vw, 7.5rem);
  --gutter: max(20px, env(safe-area-inset-left, 0px));
  --gutter-r: max(20px, env(safe-area-inset-right, 0px));
  --ease: cubic-bezier(.2, .7, .1, 1);
  color-scheme: light;
}
* { box-sizing: border-box }
html { scroll-behavior: smooth }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--face); font-size: var(--step-body); line-height: 1.5; overflow-x: hidden }
.frame { padding-left: var(--gutter); padding-right: var(--gutter-r) }
.inner { max-width: 1400px; margin: 0 auto }
h1, h2, h3 { margin: 0; font-weight: 800; letter-spacing: -0.05em; line-height: .9; text-wrap: balance; text-transform: lowercase }
p { margin: 0 }
a { color: inherit }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer }
:focus-visible { outline: 3px solid var(--ink); outline-offset: 4px }
img { display: block; max-width: 100% }
.oval { border-radius: 50% }
.sprite { background-repeat: no-repeat }

/* the action: a horizontal mark-sheet oval */
.mark { white-space: nowrap; display: inline-grid; place-items: center; min-height: 58px; padding: 0 34px; border-radius: 50%; background: var(--ink); color: var(--bg); font-weight: 800; font-size: var(--step-body); text-transform: lowercase; transition: transform .18s var(--ease), background-color .18s; text-decoration: none }
.mark:hover { transform: scale(1.05) }
.mark:active { transform: scale(.96) }
.mark.yellow { background: var(--accent); color: var(--ink) }

/* nav */
.nav { display: flex; align-items: center; justify-content: space-between; gap: 20px; padding-block: 28px }
.word { font-weight: 800; font-size: var(--step-lead); letter-spacing: -0.04em; text-decoration: none; display: flex; align-items: center; gap: 10px }
.word i { width: 16px; height: 24px; border-radius: 50%; background: var(--ink); display: inline-block }
.nav ul { display: flex; gap: 28px; list-style: none; margin: 0; padding: 0; font-size: var(--step-small); font-weight: 500 }
.nav ul a { text-decoration: none; transition: opacity .15s }
.nav ul a:hover { text-decoration: underline; text-underline-offset: 5px; text-decoration-thickness: 2px }

/* hero */
.hero { position: relative; height: max(760px, 92svh); overflow: clip }
.hero h1 { position: relative; z-index: 2; padding-top: 5vh; white-space: nowrap }
.hero-copy { position: relative; z-index: 2; max-width: 38%; margin-top: 48px; display: grid; gap: 28px; justify-items: start }
.hero h1 { font-size: var(--step-display) }
.hero .lede { max-width: 34ch; font-size: var(--step-body) }
.figs { display: flex; gap: 36px; margin: 36px 0 0 }
.figs div { display: grid }
.figs dt { font-size: var(--step-head); font-weight: 800; letter-spacing: -0.05em; line-height: 1; font-variant-numeric: tabular-nums }
.figs dd { margin: 6px 0 0; font-size: var(--step-small); font-weight: 500 }
.stage { position: absolute; z-index: 1; left: 44%; right: 0; top: calc(5vh + 220px); bottom: 0; background: var(--accent); overflow: hidden }
.stage::before { content: ""; position: absolute; left: -110px; top: -150px; width: 220px; height: 300px; border-radius: 50%; background: var(--bg) }
.probe { position: absolute; left: 140px; top: 72px; width: min(640px, calc(100% - 180px)); background: var(--bg); padding: 32px; display: grid; grid-template-columns: 200px 1fr; gap: 32px; align-items: start }
.probe .pic { width: 200px; aspect-ratio: 180 / 252; overflow: hidden }
.probe .pic > div { width: 100%; height: 100%; animation: shutter 1.1s var(--ease) both .2s }
.probe .pic > div > div { width: 100%; height: 100%; animation: settle 1.4s var(--ease) both .2s }
@keyframes shutter { from { clip-path: inset(100% 0 0 0) } to { clip-path: inset(0) } }
@keyframes settle { from { transform: scale(1.12) } to { transform: scale(1) } }
.probe h2 { font-size: var(--step-lead); letter-spacing: -0.03em; line-height: 1.1; margin-bottom: 16px; text-transform: none }
.probe .note { font-size: var(--step-small); color: var(--muted); margin-top: 14px; min-height: 2.8em }

/* the mark-sheet answer rows, used in the hero and in play */
.sheet { display: grid; gap: 6px; list-style: none; margin: 0; padding: 0 }
.row { width: 100%; display: grid; grid-template-columns: 30px 1fr; gap: 14px; align-items: center; text-align: left; padding: 9px 12px 9px 8px; border-radius: 30px; transition: background-color .15s; font-weight: 500 }
.row .b { width: 30px; height: 42px; border-radius: 50%; border: 2px solid var(--ink); display: grid; place-items: center; font-size: 13px; font-weight: 800; transition: background-color .2s, color .2s, transform .2s var(--ease) }
.row:hover:not(:disabled) { background: var(--surface) }
.row:hover:not(:disabled) .b { transform: scale(1.08) }
.row:disabled { cursor: default }
.row.picked .b { background: var(--ink); color: var(--bg) }
.row.right { background: var(--accent) }
.row.right .b { background: var(--ink); color: var(--accent) }
.row.wrong span:last-child { text-decoration: line-through; text-decoration-thickness: 2px }

/* section frame */
section.block { padding-block: clamp(96px, 12vw, 200px) 0 }

/* the band: this paper's covers, as a row of ovals */
.band { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 16px; overflow-wrap: anywhere; padding-block: clamp(72px, 8vw, 120px) 0 }
.band h2 { grid-column: 1 / -1; font-size: var(--step-head); margin-bottom: 24px }
.band figure { margin: 0; display: grid; gap: 10px; font-size: var(--step-small); font-weight: 500 }
.band .cover { width: 100%; transition: transform .25s var(--ease) }
.band figure:hover .cover { transform: translateY(-8px) rotate(-3deg) }

/* exams: sticky picture, active list */
.exams { display: grid; grid-template-columns: 5fr 1fr 6fr; align-items: start }
.exams .still { position: sticky; top: 12vh; grid-column: 1 }
.still .shape { width: min(34vw, 460px); aspect-ratio: 4 / 5; position: relative; overflow: hidden; background: var(--surface) }
.still .shape > * { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: opacity .3s }
.still p { margin-top: 18px; font-size: var(--step-small); color: var(--muted); max-width: 34ch }
.exams .list { grid-column: 3 }
.exams h2 { font-size: var(--step-head); margin-bottom: 48px }
.exam { display: block }
.exam > button { width: 100%; min-height: 64px; display: grid; grid-template-columns: 22px 1fr auto; gap: 18px; align-items: center; text-align: left; color: var(--muted) }
.exam > button i { width: 14px; height: 20px; border-radius: 50%; border: 2px solid currentColor; transition: background-color .2s }
.exam > button b { font-size: var(--step-lead); font-weight: 800; letter-spacing: -0.03em; text-transform: lowercase }
.exam > button small { font-size: var(--step-small) }
.exam.on > button { color: var(--ink) }
.exam.on > button i { background: var(--ink) }
.exam .more { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .3s var(--ease) }
.exam.on .more { grid-template-rows: 1fr }
.exam .more > div { overflow: hidden; padding-left: 40px; display: grid; gap: 16px; justify-items: start }
.exam.on .more > div { padding-bottom: 24px }
.exam .more p { max-width: 40ch }

/* faces: object on a disc */
.faces { position: relative; min-height: min(84svh, 820px); display: grid; grid-template-columns: 1fr 1fr; align-items: center }
.disc { position: absolute; left: 58%; top: 50%; translate: -50% -50%; height: 64vh; max-height: 640px; aspect-ratio: 5 / 7; border-radius: 50%; background: var(--accent); transition: background-color .3s }
.disc .face { position: absolute; left: 50%; top: -8%; translate: -50% 0; height: 82%; aspect-ratio: 180 / 252; border-radius: 50%; overflow: hidden; background: var(--ink) }
.disc .face > div { width: 100%; height: 100%; transition: opacity .3s; animation: drift 9s ease-in-out infinite alternate }
@keyframes drift { to { transform: scale(1.06) } }
.disc .fact { position: absolute; left: 100%; bottom: 18%; margin-left: 28px; width: 18ch; font-size: var(--step-body) }
.names { position: relative; z-index: 2; list-style: none; margin: 0; padding: 0; display: grid; gap: 2px }
.names li:first-child h2 { font-size: var(--step-head); color: var(--muted); line-height: 1.15; margin-bottom: 8px }
.names button { font-size: clamp(28px, 2.9vw, 44px); font-weight: 800; letter-spacing: -0.04em; line-height: 1.15; color: var(--muted); text-align: left; transition: color .2s, transform .2s var(--ease) }
.names button:hover { transform: translateX(6px) }
.names button.on { color: var(--ink) }

/* grades: the score meter enlarged */
.grades .top { display: grid; grid-template-columns: 7fr 5fr; gap: 40px; align-items: end; margin-bottom: 64px }
.grades h2 { font-size: var(--step-display); max-width: 12ch }
.meter { display: flex; gap: 6px; height: 22vh; min-height: 170px }
.seg { flex-basis: 0; min-width: 9%; padding: 20px; display: grid; align-content: space-between; position: relative }
.seg .k { font-size: clamp(22px, 2.4vw, 36px); font-weight: 800; line-height: 1 }
.seg .r { font-size: var(--step-small); font-weight: 500 }
.seg.you::after { content: ""; position: absolute; right: 14px; top: 14px; width: 18px; height: 26px; border-radius: 50%; background: currentColor }
.s0 { background: var(--surface) } .s1 { background: var(--accent) } .s2 { background: var(--ink); color: var(--bg) } .s3 { background: var(--muted); color: var(--bg) }
.clauses { display: flex; gap: 6px; margin-top: 18px }
.clauses p { flex-basis: 0; min-width: 9%; font-size: var(--step-small); padding-right: 8px }
.grades .yours { font-size: var(--step-lead); font-weight: 500; max-width: 30ch }

/* footer */
footer { margin-top: clamp(96px, 9vw, 140px); background: var(--ink); color: var(--bg); padding-block: 56px 40px }
.blocks { display: flex; gap: 4px; align-items: flex-end; height: 34svh; min-height: 220px }
.blocks span { flex: 1 1 auto; display: grid; place-items: end start; padding: 0 2vw 1vw; font-weight: 800; font-size: clamp(44px, 9.5vw, 170px); letter-spacing: -0.05em; line-height: 1; color: var(--ink); text-transform: lowercase; overflow: hidden }
.blocks span:nth-child(3n+1) { background: var(--accent) } .blocks span:nth-child(3n+2) { background: var(--bg) } .blocks span:nth-child(3n) { background: var(--surface) }
.foot { display: grid; grid-template-columns: repeat(4, 1fr) 2fr; gap: 24px; margin-top: 56px; font-size: 15px }
.foot a { text-decoration: none } .foot a:hover { text-decoration: underline }
.foot .c { grid-column: 5; display: grid; gap: 6px }
.last { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-top: 48px; font-size: var(--step-small) }

/* play */
.play { padding-block: 8px 80px; display: grid; gap: 28px }
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 14px 28px; font-weight: 500 }
.bar .exam-name { font-weight: 800; font-size: var(--step-lead); letter-spacing: -0.03em; text-transform: lowercase; margin-right: auto }
.clock { display: flex; gap: 4px }
.clock i { width: 10px; height: 15px; border-radius: 50%; border: 2px solid var(--ink); transition: background-color .25s }
.clock i.full { background: var(--ink) }
.num { font-variant-numeric: tabular-nums; white-space: nowrap }
.q { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: clamp(28px, 5vw, 80px); align-items: center; min-height: 62svh }
.q.wide { grid-template-columns: 1fr }
.q .look { display: grid; place-items: center; min-width: 0 }
.cover { width: min(380px, 100%); aspect-ratio: 46 / 65; overflow: hidden; background: var(--surface) }
.cover img { width: 100%; height: 100%; object-fit: cover }
.cover img.zoom { transition: transform 15s linear }
.portrait { width: min(340px, 100%); aspect-ratio: 180 / 252; overflow: hidden; background: var(--surface) }
.portrait > div, .banner > div { width: 100%; height: 100% }
.banner { width: 100%; aspect-ratio: 4 / 1; overflow: hidden }
.jp { background: var(--accent); width: min(520px, 100%); aspect-ratio: 7 / 5; display: grid; place-items: center; padding: 12%; text-align: center; font-size: clamp(30px, 4.4vw, 64px); font-weight: 800; line-height: 1.15; overflow-wrap: anywhere }
.q h2 { font-size: var(--step-head); margin-bottom: 28px; text-transform: none; letter-spacing: -0.04em; line-height: 1 }
.q .sheet .row { font-size: var(--step-lead); padding-block: 12px; letter-spacing: -0.01em }
.picks { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 20px }
.picks.two { grid-template-columns: repeat(2, minmax(0, 1fr)); max-width: 720px }
.pick { display: grid; gap: 10px; justify-items: center; text-align: center; font-weight: 500; font-size: var(--step-small); transition: transform .2s var(--ease) }
.pick:hover:not(:disabled) { transform: translateY(-6px) }
.pick:disabled { cursor: default }
.pick .cover { width: 100% }
.pick .b { width: 30px; height: 42px; border-radius: 50%; border: 2px solid var(--ink); display: grid; place-items: center; font-weight: 800; font-size: 13px }
.pick.right .b { background: var(--ink); color: var(--accent) } .pick.right .t { background: var(--accent); padding: 2px 10px; border-radius: 20px }
.pick.wrong .t { text-decoration: line-through }
.after { display: flex; flex-wrap: wrap; gap: 16px 28px; align-items: center; min-height: 58px; margin-top: 24px }
.after p { font-size: var(--step-lead); font-weight: 500; max-width: 36ch }
.after p b { font-weight: 800 }

/* result */
.cert { display: grid; grid-template-columns: auto 1fr; gap: clamp(28px, 6vw, 96px); align-items: center; padding-block: 6vh }
.seal { width: clamp(200px, 26vw, 360px); aspect-ratio: 5 / 7; border-radius: 50%; background: var(--accent); display: grid; place-items: center; align-content: center; gap: 8px; text-align: center; animation: stamp .5s var(--ease) both }
.seal b { font-size: clamp(56px, 8vw, 120px); line-height: 1; font-weight: 800 }
.seal span { font-weight: 800; font-size: var(--step-lead) }
@keyframes stamp { from { transform: scale(1.5) rotate(-8deg); opacity: 0 } }
.cert h1 { font-size: var(--step-display) }
.cert p { margin-top: 20px; font-size: var(--step-lead); max-width: 30ch }
.cert .actions { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 32px }
.paper { display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 14px }
.paper div { display: grid; gap: 8px; justify-items: center; text-align: center; font-size: var(--step-small); font-weight: 500 }
.paper .cover { width: 100% }
.paper .cover.miss { opacity: .45 }
.paper h2 { grid-column: 1 / -1; font-size: var(--step-head); justify-self: start; margin-bottom: 8px }

/* entrance: only when script runs; content stays visible otherwise */
.js [data-rise] { opacity: 0; transform: translateY(24px); transition: opacity .7s var(--ease), transform .7s var(--ease) }
.js [data-rise].in { opacity: 1; transform: none }

@media (max-width: 900px) {
  .nav ul { gap: 18px }
  .nav ul li.hide { display: none }
  .hero { height: auto }
  .hero-copy { max-width: none; margin-top: 24px }
  .hero h1 { font-size: 13vw; white-space: normal; padding-top: 3vh }
  .stage { position: relative; left: auto; right: auto; top: auto; margin: 48px calc(-1 * var(--gutter-r)) 0 calc(-1 * var(--gutter)); width: auto; padding: 88px 16px 40px }
  .stage::before { left: -40px; top: -60px; width: 112px; height: 150px }
  .probe { position: relative; left: auto; top: auto; width: 100%; grid-template-columns: 1fr; padding: 20px; gap: 20px }
  .probe .pic { width: 150px }
  .exams { grid-template-columns: 1fr; gap: 28px }
  .band { grid-template-columns: repeat(4, minmax(0, 1fr)) }
  .grades .top { grid-template-columns: 1fr; gap: 24px }
  .exams .still { order: 2; position: static; display: grid; grid-template-columns: auto 1fr; gap: 16px; align-items: center }
  .still .shape { width: 26vw; aspect-ratio: 4 / 5 }
  .still p { margin: 0 }
  .exams .list { grid-column: 1 }
  .faces { grid-template-columns: 1fr; min-height: 0; gap: 32px; align-items: start; padding-bottom: 96px }
  .figs { gap: 28px; margin-top: 8px }
  .disc { position: relative; left: auto; top: auto; translate: none; height: auto; width: 74vw; justify-self: center; margin-top: 18vw }
  .disc .fact { position: static; margin: 0; width: auto; translate: 0 calc(100% + 16px); position: absolute; left: 0; right: 0; bottom: 0; text-align: center }
  .names { padding: 72px 0 0; display: flex; gap: 6px 22px; flex-wrap: wrap }
  .names li:first-child { width: 100% }
  .names li:first-child h2 { margin: 0 0 6px }
  .names button, .names li:first-child h2 { font-size: 26px }
  .meter { flex-direction: column; height: 70svh }
  .seg { min-height: 72px; min-width: 0 }
  .clauses { display: none }
  .seg .r::before { content: attr(data-c) " · " }
  .foot { grid-template-columns: 1fr 1fr }
  .foot .c { grid-column: 1 / -1 }
  .q, .cert { grid-template-columns: 1fr; min-height: 0 }
  .cover { width: min(240px, 64vw) }
  .portrait { width: min(220px, 58vw) }
  .picks { grid-template-columns: repeat(2, minmax(0, 1fr)) }
  .paper { grid-template-columns: repeat(5, minmax(0, 1fr)) }
}
@media (max-width: 520px) {
  .nav ul li:not(.keep) { display: none }
  .blocks { height: 22svh; min-height: 150px }
  .blocks span { font-size: 9.5vw; padding: 0 6px 6px }
  .bar .exam-name { width: 100% }
}
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto }
  *, *::before, *::after { animation: none !important; transition-duration: .01ms !important }
  .js [data-rise] { opacity: 1; transform: none }
}
</style>

<div id="app"></div>

<script>
document.documentElement.classList.add('js');
const D = __DATA__;
const AT = { p: [10, 10], b: [2, 20] };
const N = 10, LIMIT = 15;
const rnd = n => Math.floor(Math.random() * n);
const pick = a => a[rnd(a.length)];
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]] } return a };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const coverUrl = a => `img/cv/${a.id}.jpg`;
const cover = (a, cls = '', imgCls = '') => `<div class="cover oval ${cls}"><img class="${imgCls}" src="${coverUrl(a)}" alt="Cover of ${esc(a.title)}" loading="lazy"></div>`;
function sprite(kind, ref) {
  const [cols, rows] = AT[kind], col = ref[1] % cols, row = Math.floor(ref[1] / cols);
  return `background-image:url(img/${kind}${ref[0]}.jpg);background-size:${cols * 100}% ${rows * 100}%;background-position:${col / (cols - 1) * 100}% ${row / (rows - 1) * 100}%`;
}
const loads = {};
const load = u => loads[u] || (loads[u] = new Promise(r => { const i = new Image(); i.onload = i.onerror = r; i.src = u }));
const ordinal = n => ['', '1st', '2nd', '3rd', '4th', '5th'][n];

// wrong answers come from shows that share a genre, so they are plausible
function others(a, n, ok = () => true) {
  const near = shuffle(D.filter(x => x !== a && ok(x) && x.genres.some(g => a.genres.includes(g))));
  const rest = shuffle(D.filter(x => x !== a && ok(x) && !near.includes(x)));
  return near.slice(0, n * 2).concat(rest).slice(0, n);
}
const titleOpts = a => shuffle([a, ...others(a, 3, x => x.title !== a.title)]).map(x => ({ label: x.title, right: x === a }));
const withChars = D.filter(x => x.ch.length);

const MODES = {
  mix: { jp: '総合', name: 'the full exam', d: 'Ten questions drawn from every paper below. This is the one that gives you a grade.', pic: () => ['c', pick(D.filter(x => !x.lo))] },
  cover: { jp: '表紙', name: 'cover zoom', d: 'The cover starts close up and pulls back over fifteen seconds. Name it early for more points.', pic: () => ['c', pick(D.filter(x => !x.lo))],
    make() {
      const a = pick(D.filter(x => !x.lo)), ox = 20 + rnd(60), oy = 15 + rnd(50);
      return { a, ask: 'Which show is this cover from?', need: [coverUrl(a)],
        look: `<div class="cover oval"><img class="zoom" src="${coverUrl(a)}" alt="A close crop of a cover" style="transform:scale(3.2);transform-origin:${ox}% ${oy}%"></div>`,
        opts: titleOpts(a), tell: `It was <b>${esc(a.title)}</b> (${a.year}).` };
    } },
  who: { jp: '誰', name: 'whose character', d: 'One character portrait. Pick the show they come from.', pic: () => ['p', pick(withChars)],
    make() {
      const a = pick(withChars), c = pick(a.ch);
      return { a, c, ask: 'Which show is this character from?', need: [`img/p${c.at[0]}.jpg`],
        look: `<div class="portrait oval"><div class="sprite" role="img" aria-label="A character portrait" style="${sprite('p', c.at)}"></div></div>`,
        opts: titleOpts(a), tell: `That is <b>${esc(c.n)}</b> from ${esc(a.title)}.` };
    } },
  name: { jp: '名前', name: 'name the face', d: 'You know the face. Now pick the right name out of four.', pic: () => ['p', pick(withChars)],
    make() {
      const a = pick(withChars), c = pick(a.ch);
      const names = [...new Set(shuffle(others(a, 12).flatMap(x => x.ch)).map(x => x.n))].filter(n => n !== c.n).slice(0, 3);
      return { a, ask: 'What is this character called?', need: [`img/p${c.at[0]}.jpg`],
        look: `<div class="portrait oval"><div class="sprite" role="img" aria-label="A character portrait" style="${sprite('p', c.at)}"></div></div>`,
        opts: shuffle([{ label: c.n, right: true }, ...names.map(n => ({ label: n }))]), tell: `<b>${esc(c.n)}</b>, from ${esc(a.title)}.` };
    } },
  scene: { jp: '場面', name: 'the wide shot', d: 'A wide banner still from the show, no title on it. Which series is it?', pic: () => ['c', pick(D.filter(x => x.bn && !x.lo))],
    make() {
      const a = pick(D.filter(x => x.bn));
      return { a, ask: 'Which show is this scene from?', need: [`img/b${a.bn[0]}.jpg`], wide: true,
        look: `<div class="banner oval"><div class="sprite" role="img" aria-label="A wide still from a show" style="${sprite('b', a.bn)}"></div></div>`,
        opts: titleOpts(a), tell: `It was <b>${esc(a.title)}</b>.` };
    } },
  kana: { jp: '漢字', name: 'read the japanese', d: 'The original Japanese title, and four covers. Match them.', pic: () => ['c', pick(D.filter(x => !x.lo))],
    make() {
      const a = pick(D.filter(x => x.jp && x.jp !== x.title));
      const o = shuffle([a, ...others(a, 3, x => x.title !== a.title)]);
      return { a, ask: 'Which cover belongs to this title?', need: o.map(coverUrl), wide: true, picks: true, hide: true,
        look: `<div class="jp oval" lang="ja">${esc(a.jp)}</div>`,
        opts: o.map(x => ({ label: x.title, show: x, right: x === a })), tell: `${esc(a.jp)} is <b>${esc(a.title)}</b>.` };
    } },
  duel: { jp: '上下', name: 'higher or lower', d: 'Two shows side by side. Which one scores higher on AniList?', pic: () => ['c', pick(D.filter(x => !x.lo))],
    make() {
      let a, b; do { a = pick(D); b = pick(D) } while (a === b || Math.abs(a.score - b.score) < 4);
      const hi = a.score > b.score ? a : b;
      return { a: hi, ask: 'Which one has the higher AniList score?', need: [coverUrl(a), coverUrl(b)], wide: true, picks: true, two: true,
        look: '', opts: [a, b].map(x => ({ label: x.title, show: x, right: x === hi })), tell: `${esc(a.title)} scores <b>${a.score}</b>, ${esc(b.title)} scores <b>${b.score}</b>.` };
    } },
  year: { jp: '年', name: 'which year', d: 'Look at the cover and guess the year it first aired.', pic: () => ['c', pick(D.filter(x => !x.lo))],
    make() {
      const a = pick(D.filter(x => x.year)), set = new Set([a.year]);
      for (const s of shuffle([-12, -8, -5, -3, 3, 5, 8, 12])) { const y = a.year + s; if (set.size < 4 && y <= 2026 && y >= 1970) set.add(y) }
      return { a, ask: 'What year did this first air?', need: [coverUrl(a)], look: cover(a),
        opts: [...set].sort().map(y => ({ label: String(y), right: y === a.year })), tell: `${esc(a.title)} first aired in <b>${a.year}</b>.` };
    } },
  studio: { jp: '工房', name: 'name the studio', d: 'Every show had a studio behind it. Pick the one that animated this.', pic: () => ['c', pick(D.filter(x => !x.lo))],
    make() {
      const a = pick(D.filter(x => x.studio));
      const st = shuffle([...new Set(D.map(x => x.studio).filter(s => s && s !== a.studio))]).slice(0, 3);
      return { a, ask: 'Which studio animated this?', need: [coverUrl(a)], look: cover(a),
        opts: shuffle([{ label: a.studio, right: true }, ...st.map(s => ({ label: s }))]), tell: `${esc(a.title)} was made by <b>${esc(a.studio)}</b>.` };
    } }
};
const PAPERS = Object.keys(MODES).filter(k => k !== 'mix');

// grade thresholds on a 0..1 result; widths of the meter follow the real ranges
const RANKS = [[0, '五級', '5th kyū', 'You are just starting out.'], [.3, '四級', '4th kyū', 'You know the big shows.'],
  [.5, '三級', '3rd kyū', 'A steady watcher.'], [.65, '二級', '2nd kyū', 'Your friends ask you what to watch.'],
  [.8, '一級', '1st kyū', 'You know covers from across the room.'], [.9, '初段', 'shodan', 'First dan. Black belt.'], [.97, '名人', 'meijin', 'Master. Nothing left to prove.']];
const rankOf = r => RANKS.filter(x => r >= x[0]).pop();
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem('kentei:' + k)) } catch { return null } },
  set(k, v) { try { localStorage.setItem('kentei:' + k, JSON.stringify(v)) } catch {} }
};

const app = document.getElementById('app');
let game = null, timer = null, io = null;

function rise() {
  io?.disconnect();
  if (!('IntersectionObserver' in window)) return app.querySelectorAll('[data-rise]').forEach(e => e.classList.add('in'));
  io = new IntersectionObserver(es => es.forEach(e => {
    if (!e.isIntersecting) return;
    const sibs = [...e.target.parentElement.querySelectorAll(':scope > [data-rise]')];
    e.target.style.transitionDelay = Math.max(0, sibs.indexOf(e.target)) * 80 + 'ms';
    e.target.classList.add('in'); io.unobserve(e.target);
  }), { threshold: .12 });
  app.querySelectorAll('[data-rise]').forEach(e => io.observe(e));
}

const nav = () => `
  <nav class="nav frame"><div class="inner" style="display:contents">
    <a class="word" href="#top" data-home><i></i>anime kentei</a>
    <ul><li><a href="#exams">exams</a></li><li class="hide"><a href="#faces">faces</a></li><li><a href="#grades">grades</a></li><li class="keep"><a href="https://thrunycn.github.io/animeter/">animeter</a></li></ul>
  </div></nav>`;

function home() {
  clearInterval(timer); game = null;
  const best = store.get('best:mix');
  const yours = best ? rankOf(best.ratio) : null;
  const heroQ = MODES.who.make();
  const faces = shuffle(withChars.filter(x => x.pop > 300000)).slice(0, 5).map(a => ({ a, c: a.ch[0] }));
  const total = RANKS.map((r, i) => (RANKS[i + 1]?.[0] ?? 1) - r[0]);
  app.innerHTML = `
  ${nav()}
  <header class="hero frame" id="top">
    <h1>sit the anime exam</h1>
    <div class="hero-copy">
      <p class="lede">Eight quizzes built on real cover art, character portraits and scenes from ${D.length} shows. Ten questions, fifteen seconds each, and a grade from 5th kyū to meijin at the end.</p>
      <button class="mark" data-start="mix">take the exam</button>
      <dl class="figs"><div><dt>${D.length}</dt><dd>shows</dd></div><div><dt>${D.reduce((s, x) => s + x.ch.length, 0)}</dt><dd>faces</dd></div><div><dt>15s</dt><dd>a question</dd></div></dl>
    </div>
    <div class="stage">
      <div class="probe" data-ui>
        <div class="pic oval"><div><div class="sprite" role="img" aria-label="A character portrait" style="${sprite('p', heroQ.c.at)}"></div></div></div>
        <div>
          <h2>Question 1. ${heroQ.ask}</h2>
          <ol class="sheet">${heroQ.opts.map((o, i) => `<li><button class="row" data-h="${i}"><span class="b">${i + 1}</span><span>${esc(o.label)}</span></button></li>`).join('')}</ol>
          <p class="note" id="hnote">Fill one oval. This is a real question from the paper.</p>
        </div>
      </div>
    </div>
  </header>

  <section class="frame" aria-labelledby="bandh"><div class="inner band">
    <h2 id="bandh" data-rise>on today's paper</h2>
    ${shuffle(D.filter(x => !x.lo && x.pop > 250000)).slice(0, 8).map(a => `<figure data-rise>${cover(a)}<figcaption>${esc(a.title)}</figcaption></figure>`).join('')}
  </div></section>

  <section class="block frame" id="exams"><div class="inner exams">
    <div class="still">
      <div class="shape oval" id="still"></div>
      <p id="stillcap"></p>
    </div>
    <div class="list">
      <h2 data-rise>eight papers, one grade</h2>
      ${['mix', ...PAPERS].map((k, i) => `
      <div class="exam${i === 0 ? ' on' : ''}" data-k="${k}" data-rise>
        <button aria-expanded="${i === 0}"><i></i><b>${MODES[k].name}</b><small>${k === 'mix' ? 'graded' : '10 questions'}</small></button>
        <div class="more"><div><p>${MODES[k].d}${store.get('best:' + k) ? ` Your best: ${store.get('best:' + k).score} points.` : ''}</p><button class="mark yellow" data-start="${k}">start ${k === 'mix' ? 'the exam' : 'this paper'}</button></div></div>
      </div>`).join('')}
    </div>
  </div></section>

  <section class="block frame" id="faces"><div class="inner faces">
    <ul class="names">
      <li><h2>faces on the paper</h2></li>
      ${faces.map((f, i) => `<li><button class="${i ? '' : 'on'}" data-f="${i}">${esc(f.c.n)}</button></li>`).join('')}
    </ul>
    <div class="disc" aria-live="polite">
      <div class="face"><div class="sprite" id="face" role="img" aria-label="Portrait of ${esc(faces[0].c.n)}" style="${sprite('p', faces[0].c.at)}"></div></div>
      <p class="fact" id="fact"></p>
    </div>
  </div></section>

  <section class="block frame grades" id="grades"><div class="inner">
    <div class="top"><h2 data-rise>how the grade works</h2>
    <p class="yours" data-rise>${yours ? `Your best on the full exam is ${yours[2]}, with ${best.right} of ${N} right.` : 'Correct answers score 100 points, plus up to 90 for speed. Your grade comes from both.'}</p></div>
    <div class="meter" data-ui data-rise>${RANKS.map((r, i) => `<div class="seg s${[0, 1, 2, 3, 0, 1, 2][i]}${yours && yours[1] === r[1] ? ' you' : ''}" style="flex-grow:${Math.round(total[i] * 100)}"><span class="k" lang="ja">${r[1]}</span><span class="r" data-c="${r[2]}">${Math.round(r[0] * 100)}–${Math.round((RANKS[i + 1]?.[0] ?? 1) * 100)}%</span></div>`).join('')}</div>
    <div class="clauses">${RANKS.map((r, i) => `<p style="flex-grow:${Math.round(total[i] * 100)}"><b>${r[2]}</b></p>`).join('')}</div>
  </div></section>

  <footer class="frame"><div class="inner">
    <div class="blocks" aria-label="Anime Kentei"><span lang="ja" style="height:78%">アニメ</span><span lang="ja" style="height:100%">検定</span><span style="height:64%">kentei</span></div>
    <div class="foot">
      <a href="#exams">exams</a><a href="#faces">faces</a><a href="#grades">grades</a><a href="https://thrunycn.github.io/animeter/">animeter</a>
      <div class="c"><span>Covers, character art, banners and scores from AniList.</span><span>${D.length} shows, ${D.reduce((s, x) => s + x.ch.length, 0)} characters.</span></div>
    </div>
    <div class="last"><span>Anime Kentei, 2026. Not an official exam.</span><button class="mark yellow" data-start="mix">take the exam</button></div>
  </div></footer>`;

  // hero question
  app.querySelectorAll('[data-h]').forEach(b => b.onclick = () => {
    const i = +b.dataset.h, rows = app.querySelectorAll('[data-h]');
    rows.forEach((r, j) => { r.disabled = true; if (heroQ.opts[j].right) r.classList.add('right'); else if (j === i) r.classList.add('wrong', 'picked') });
    document.getElementById('hnote').innerHTML = (heroQ.opts[i].right ? 'Correct. ' : 'Not this time. ') + heroQ.tell + ' There are nine more on the full exam.';
  });
  // exam list
  const still = document.getElementById('still'), cap = document.getElementById('stillcap');
  const show = k => {
    const [kind, a] = MODES[k].pic();
    still.innerHTML = kind === 'c' ? `<img src="${coverUrl(a)}" alt="Cover of ${esc(a.title)}">` : `<div class="sprite" role="img" aria-label="Portrait of ${esc(a.ch[0].n)}" style="${sprite('p', a.ch[0].at)}"></div>`;
    cap.textContent = kind === 'c' ? `${a.title}, ${a.year}` : `${a.ch[0].n}, from ${a.title}`;
  };
  app.querySelectorAll('.exam').forEach(ex => {
    const on = () => { app.querySelectorAll('.exam').forEach(e => { e.classList.toggle('on', e === ex); e.firstElementChild.setAttribute('aria-expanded', e === ex) }); show(ex.dataset.k) };
    ex.firstElementChild.onclick = on;
    ex.firstElementChild.onfocus = on;
    ex.onmouseenter = () => { if (!ex.classList.contains('on')) on() };
  });
  show('mix');
  // faces
  const fact = document.getElementById('fact'), face = document.getElementById('face');
  const setFace = i => {
    const f = faces[i];
    face.style.cssText = sprite('p', f.c.at); face.setAttribute('aria-label', 'Portrait of ' + f.c.n);
    fact.textContent = `From ${f.a.title}, ${f.a.year}. Asked in whose character and name the face.`;
    app.querySelectorAll('[data-f]').forEach(b => b.classList.toggle('on', +b.dataset.f === i));
  };
  app.querySelectorAll('[data-f]').forEach(b => { b.onclick = () => setFace(+b.dataset.f); b.onmouseenter = () => setFace(+b.dataset.f) });
  setFace(0);
  bind();
  rise();
}

function bind() {
  app.querySelectorAll('[data-start]').forEach(b => b.onclick = () => start(b.dataset.start));
  app.querySelectorAll('[data-home]').forEach(b => b.onclick = e => { if (game || !app.querySelector('.hero')) { e.preventDefault(); home(); scrollTo(0, 0) } });
}

function start(mode) {
  game = { mode, i: 0, score: 0, right: 0, log: [], seen: new Set() };
  scrollTo(0, 0);
  next();
}

async function next() {
  if (game.i >= N) return finish();
  const key = game.mode === 'mix' ? pick(PAPERS) : game.mode;
  let q, tries = 0;
  do { q = MODES[key].make() } while (game.seen.has(q.a.id) && ++tries < 30);
  game.seen.add(q.a.id); q.key = key; game.q = q;
  await Promise.all(q.need.map(load));
  if (!game || game.q !== q) return;
  const m = MODES[key];
  const answers = q.picks
    ? `<ol class="picks ${q.two ? 'two' : ''}" style="list-style:none;margin:0;padding:0">${q.opts.map((o, i) => `<li><button class="pick" data-i="${i}" style="width:100%">${cover(o.show)}<span class="b">${i + 1}</span><span class="t">${q.hide ? 'which one?' : esc(o.label)}</span></button></li>`).join('')}</ol>`
    : `<ol class="sheet">${q.opts.map((o, i) => `<li><button class="row" data-i="${i}"><span class="b">${i + 1}</span><span>${esc(o.label)}</span></button></li>`).join('')}</ol>`;
  app.innerHTML = `
  ${nav()}
  <main class="frame"><div class="inner play">
    <div class="bar">
      <span class="exam-name">${game.mode === 'mix' ? 'the full exam · ' : ''}${m.name}</span>
      <span class="clock" aria-label="Time left">${'<i class="full"></i>'.repeat(LIMIT)}</span>
      <span class="num">question ${game.i + 1} of ${N}</span>
      <span class="num">${game.score} points</span>
      <button class="mark yellow" id="quit" style="min-height:44px;padding:0 22px">leave</button>
    </div>
    <div class="q ${q.wide ? 'wide' : ''}">
      ${q.look ? `<div class="look">${q.look}</div>` : ''}
      <div>
        <h2>${q.ask}</h2>
        ${answers}
        <div class="after" id="after" aria-live="polite"></div>
      </div>
    </div>
  </div></main>`;
  bind();
  document.getElementById('quit').onclick = home;
  app.querySelectorAll('[data-i]').forEach(b => b.onclick = () => answer(+b.dataset.i));
  const z = app.querySelector('.zoom');
  if (z) requestAnimationFrame(() => requestAnimationFrame(() => z.style.transform = 'scale(1)'));
  q.t0 = performance.now();
  const dots = [...app.querySelectorAll('.clock i')];
  clearInterval(timer);
  timer = setInterval(() => {
    const left = LIMIT - (performance.now() - q.t0) / 1000;
    dots.forEach((d, i) => d.classList.toggle('full', i < Math.ceil(left)));
    if (left <= 0) answer(-1);
  }, 200);
}

function answer(i) {
  const q = game?.q;
  if (!q || q.done) return;
  q.done = true; clearInterval(timer);
  const secs = (performance.now() - q.t0) / 1000;
  const ok = i >= 0 && q.opts[i].right;
  const pts = ok ? 100 + Math.round(Math.max(0, LIMIT - secs) * 6) : 0;
  game.score += pts; if (ok) game.right++;
  game.log.push({ a: q.a, ok });
  app.querySelectorAll('[data-i]').forEach((b, j) => {
    b.disabled = true;
    if (q.opts[j].right) b.classList.add('right'); else if (j === i) b.classList.add('wrong', 'picked');
    const t = b.querySelector('.t'); if (t) t.textContent = q.opts[j].label;
  });
  const z = app.querySelector('.zoom');
  if (z) { z.style.transition = 'transform .5s ease-out'; z.style.transform = 'scale(1)' }
  game.i++;
  const last = game.i >= N;
  document.getElementById('after').innerHTML = `<p>${ok ? `Correct, plus ${pts}. ` : i < 0 ? 'Time is up. ' : 'Not this one. '}${q.tell}</p><button class="mark" id="nx">${last ? 'see your grade' : 'next question'}</button>`;
  const nx = document.getElementById('nx'); nx.onclick = next; nx.focus({ preventScroll: true });
  app.querySelectorAll('.bar .num')[1].textContent = `${game.score} points`;
}

function finish() {
  const acc = game.right / N, ratio = Math.min(game.score / (N * 190) * 1.25, acc);
  const rk = rankOf(ratio), mode = game.mode, m = MODES[mode];
  const prev = store.get('best:' + mode), isBest = !prev || game.score > prev.score;
  if (isBest) store.set('best:' + mode, { score: game.score, right: game.right, ratio });
  app.innerHTML = `
  ${nav()}
  <main class="frame"><div class="inner">
    <section class="cert">
      <div class="seal"><b lang="ja">${rk[1]}</b><span>${rk[2]}</span></div>
      <div>
        <h1>${game.right} of ${N}, ${game.score} points</h1>
        <p>${mode === 'mix' ? `Your grade is ${rk[2]}. ` : `On ${m.name} that is ${rk[2]} level. `}${rk[3]} ${isBest && prev ? 'That is a new best.' : prev ? `Your best is ${prev.score}.` : ''}</p>
        <div class="actions"><button class="mark" id="again">sit it again</button><button class="mark yellow" id="menu">all papers</button></div>
      </div>
    </section>
    <section class="paper">
      <h2>your answer sheet</h2>
      ${game.log.map(l => `<div>${cover(l.a, l.ok ? '' : 'miss')}<span>${l.ok ? '○' : '×'} ${esc(l.a.title)}</span></div>`).join('')}
    </section>
  </div></main>`;
  bind();
  document.getElementById('again').onclick = () => start(mode);
  document.getElementById('menu').onclick = () => { home(); document.getElementById('exams').scrollIntoView() };
  game = null;
}

document.addEventListener('keydown', e => {
  if (!game?.q || e.metaKey || e.ctrlKey || e.altKey) return;
  const n = +e.key;
  if (!game.q.done && n >= 1 && n <= game.q.opts.length) answer(n - 1);
});

home();
</script>
